name: limousine
description: "Local dev orchestrator (headless Dart server + Flutter web UI)"
publish_to: 'none'
version: 0.4.3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  xterm: ^4.0.0
  # Vendored fork of flutter_pty 0.4.2 — patched wait_exit_thread so unrelated
  # SIGCHLD deliveries on macOS don't interrupt waitpid and post bogus exit
  # codes (which would close a live PTY's output port). See
  # vendor/flutter_pty/CHANGELOG.md and src/flutter_pty_unix.c for the patch.
  flutter_pty:
    path: vendor/flutter_pty
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  path: ^1.9.1
  logging: ^1.3.0
  google_fonts:
  mcp_dart: ^2.0.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^3.0.0
  shelf_static: ^1.1.0
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  args: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

fonts:
   - family: Cascadia Mono
     fonts:
       - asset: fonts/CascadiaMonoPL.ttf
