[project]
name = "limousine"
version = "0.2.1"
description = "Local dev orchestrator — Textual TUI"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "ptyprocess>=0.7",
    "mcp>=1.9",
    "uvicorn>=0.30",
]

[project.scripts]
limousine = "limousine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["limousine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
